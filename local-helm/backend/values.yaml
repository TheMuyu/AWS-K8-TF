replicaCount: 1
image:
  repository: local-backend
  tag: "latest"
  pullPolicy: Never
service:
  port: 8080
resources:
  requests:
    cpu: 200m
  limits:
    cpu: 500m
env:
  DB_HOST: postgres-service
  DB_NAME: mydb
  DB_USERNAME: myuser
  DB_PASSWORD: mypass
postgres:
  image: postgres:15
  storage: 1Gi
