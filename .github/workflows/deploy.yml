name: Build and Deploy

on:
  release:
    types: [created]

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.ECR_REPO_BACKEND }}:${{ env.RELEASE_VERSION }}

    env:
      AWS_REGION: eu-central-1
      ECR_REPO_BACKEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND

      - name: Build and push backend image
        run: |
          docker build -t $ECR_REPO_BACKEND:$RELEASE_VERSION ./backend/SumApi
          docker push $ECR_REPO_BACKEND:$RELEASE_VERSION

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPO_BACKEND }}:${{ env.RELEASE_VERSION }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.ECR_REPO_FRONTEND }}:${{ env.RELEASE_VERSION }}

    env:
      AWS_REGION: eu-central-1
      ECR_REPO_FRONTEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Build and push frontend image
        run: |
          docker build -t $ECR_REPO_FRONTEND:$RELEASE_VERSION ./frontend/sum-app
          docker push $ECR_REPO_FRONTEND:$RELEASE_VERSION

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPO_FRONTEND }}:${{ env.RELEASE_VERSION }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  deploy-backend:
    name: Deploy Backend
    needs: build-backend
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      ECR_REPO_BACKEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Setup kubectl
        run: |
          aws eks --region $AWS_REGION update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Retrieve DB credentials from AWS Secrets Manager
        id: db_secrets
        run: |
          # Get the latest db-credentials secret
          LATEST_SECRET=$(aws secretsmanager list-secrets \
            --query "SecretList[?starts_with(Name, 'db-credentials-')].Name" \
            --output text | tr '\t' '\n' | sort -V | tail -n 1)
          
          if [ -z "$LATEST_SECRET" ]; then
            echo "ERROR: No db-credentials secret found"
            exit 1
          fi
          
          echo "Using secret: $LATEST_SECRET"
          
          # Get the secret value
          secrets=$(aws secretsmanager get-secret-value --secret-id "$LATEST_SECRET" --query SecretString --output text)
          echo "$secrets" > db_creds.json
          echo "::set-output name=db_username::$(jq -r .username db_creds.json)"
          echo "::set-output name=db_password::$(jq -r .password db_creds.json)"
          echo "::set-output name=db_name::$(jq -r .dbname db_creds.json)"

      - name: Get RDS endpoint
        id: rds
        run: |
          rds_endpoint=$(aws rds describe-db-instances --db-instance-identifier sumdb-instance --query "DBInstances[0].Endpoint.Address" --output text)
          echo "::set-output name=endpoint::$rds_endpoint"

      - name: Deploy backend with Helm
        run: |
          helm upgrade --install backend ./terraform/helm/backend \
            --namespace default \
            --set image.repository=$ECR_REPO_BACKEND \
            --set image.tag=$RELEASE_VERSION \
            --set dbCredentials.username="${{ steps.db_secrets.outputs.db_username }}" \
            --set dbCredentials.password="${{ steps.db_secrets.outputs.db_password }}" \
            --set dbCredentials.dbname="${{ steps.db_secrets.outputs.db_name }}" \
            --set dbCredentials.host="${{ steps.rds.outputs.endpoint }}"

  deploy-frontend:
    name: Deploy Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    outputs:
      alb_hostname: ${{ steps.get_ingress.outputs.alb_hostname }}

    env:
      AWS_REGION: eu-central-1
      ECR_REPO_FRONTEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Setup kubectl
        run: |
          aws eks --region $AWS_REGION update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy frontend with Helm
        run: |
          helm upgrade --install frontend ./terraform/helm/frontend \
            --namespace default \
            --set image.repository=$ECR_REPO_FRONTEND \
            --set image.tag=$RELEASE_VERSION \
            --set ingress.host=app.muratyurtdas.com

      - name: Wait for Ingress and extract ALB hostname
        id: get_ingress
        run: |
          for i in {1..30}; do
            ALB_HOST=$(kubectl get ingress frontend-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [[ "$ALB_HOST" != "" ]]; then break; fi
            echo "Waiting for ALB to be ready... ($i)"
            sleep 10
          done
          if [[ "$ALB_HOST" == "" ]]; then
            echo "ERROR: ALB hostname is still empty after waiting."
            exit 1
          fi
          echo "alb_hostname=$ALB_HOST" >> $GITHUB_OUTPUT

  route53:
    name: Update Route53 Records
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Get Route53 Hosted Zone ID
        id: get_zone
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name muratyurtdas.com \
            --query "HostedZones[0].Id" \
            --output text)
          ZONE_ID=${ZONE_ID#/hostedzone/}
          echo "HOSTED_ZONE_ID=$ZONE_ID" >> $GITHUB_ENV

      - name: Get ALB Canonical Hosted Zone ID
        id: get_alb_zone
        run: |
          ALB_HOST=${{ needs.deploy-frontend.outputs.alb_hostname }}
          if [ -z "$ALB_HOST" ]; then
            echo "ERROR: ALB_HOST not set"
            exit 1
          fi

          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?DNSName=='$ALB_HOST'].LoadBalancerArn" \
            --output text)

          if [ -z "$ALB_ARN" ]; then
            echo "ERROR: ALB ARN not found"
            exit 1
          fi

          ALIAS_ZONE_ID=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$ALB_ARN" \
            --query "LoadBalancers[0].CanonicalHostedZoneId" \
            --output text)

          if [ -z "$ALIAS_ZONE_ID" ]; then
            echo "ERROR: CanonicalHostedZoneId not found"
            exit 1
          fi

          echo "ALIAS_ZONE_ID=$ALIAS_ZONE_ID" >> $GITHUB_ENV

      - name: Update Route53 Record
        run: |
          RECORD_NAME=app.muratyurtdas.com
          ALIAS_NAME=${{ needs.deploy-frontend.outputs.alb_hostname }}

          cat <<EOF > change-batch.json
          {
            "Comment": "Update alias record to point to ALB",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$RECORD_NAME",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "${{ env.ALIAS_ZONE_ID }}",
                    "DNSName": "$ALIAS_NAME",
                    "EvaluateTargetHealth": true
                  }
                }
              }
            ]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTED_ZONE_ID \
            --change-batch file://change-batch.json
