name: Build and Deploy

on:
  release:
    types: [created]

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-central-1
      ECR_REPO_BACKEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/backend
      ECR_REPO_FRONTEND: 482397832867.dkr.ecr.eu-central-1.amazonaws.com/aws-k8s-tf/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Build backend image
        run: |
          docker build -t $ECR_REPO_BACKEND:$RELEASE_VERSION ./backend/SumApi

      # - name: Scan backend image with Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.ECR_REPO_BACKEND }}:${{ env.RELEASE_VERSION }}
      #     format: table
      #     exit-code: 0
      #     severity: CRITICAL,HIGH

      - name: Push backend image
        run: |
          docker push $ECR_REPO_BACKEND:$RELEASE_VERSION

      - name: Build frontend image
        run: |
          docker build -t $ECR_REPO_FRONTEND:$RELEASE_VERSION ./frontend/sum-app

      # - name: Scan frontend image with Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.ECR_REPO_FRONTEND }}:${{ env.RELEASE_VERSION }}
      #     format: table
      #     exit-code: 0
      #     severity: CRITICAL,HIGH
  
      - name: Push frontend image
        run: |
          docker push $ECR_REPO_FRONTEND:$RELEASE_VERSION

      - name: Setup kubectl
        run: |
          aws eks --region $AWS_REGION update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}
          
      # - name: Create amazon-cloudwatch namespace
      #   run: |
      #     kubectl create namespace amazon-cloudwatch --dry-run=client -o yaml | kubectl apply -f -
        
      # - name: Deploy CloudWatch Container Insights
      #   run: |
      #     kubectl apply -f terraform/modules/watch/manifests/cwagent-configmap.yaml
      #     kubectl apply -f terraform/modules/watch/manifests/cwagent-fluentd-eks.yaml

      - name: Retrieve DB credentials from AWS Secrets Manager
        id: db_secrets
        run: |
          secrets=$(aws secretsmanager get-secret-value --secret-id db-credentials-5 --query SecretString --output text)
          echo "$secrets" > db_creds.json
          echo "::set-output name=db_username::$(jq -r .username db_creds.json)"
          echo "::set-output name=db_password::$(jq -r .password db_creds.json)"
          echo "::set-output name=db_name::$(jq -r .dbname db_creds.json)"
          
      - name: Get RDS endpoint
        id: rds
        run: |
          rds_endpoint=$(aws rds describe-db-instances --db-instance-identifier sumdb-instance --query "DBInstances[0].Endpoint.Address" --output text)
          echo "::set-output name=endpoint::$rds_endpoint"

      - name: Create Kubernetes Secret for backend
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: db-credentials
            namespace: backend
          type: Opaque
          stringData:
            username: "${{ steps.db_secrets.outputs.db_username }}"
            password: "${{ steps.db_secrets.outputs.db_password }}"
            dbname: "${{ steps.db_secrets.outputs.db_name }}"
            host: "${{ steps.rds.outputs.endpoint }}"
          EOF

      - name: Deploy with Helm
        run: |
          helm upgrade --install backend ./terraform/helm/backend \
            --namespace default \
            --set image.repository=$ECR_REPO_BACKEND \
            --set image.tag=$RELEASE_VERSION

          helm upgrade --install frontend ./terraform/helm/frontend \
            --namespace default \
            --set image.repository=$ECR_REPO_FRONTEND \
            --set image.tag=$RELEASE_VERSION \
            --set ingress.host=app.muratyurtdas.com

      - name: Update Route53 Record
        run: |
          HOSTED_ZONE_ID=Z215JYRZR1TBD
          RECORD_NAME=app.muratyurtdas.com
          ALIAS_NAME=$ALB_HOST

          cat <<EOF > change-batch.json
          {
            "Comment": "Update alias record to point to ALB",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$RECORD_NAME",
                  "Type": "A",
                  "AliasTarget": {
                    "HostedZoneId": "$HOSTED_ZONE_ID",
                    "DNSName": "$ALIAS_NAME",
                    "EvaluateTargetHealth": true
                  }
                }
              }
            ]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTED_ZONE_ID \
            --change-batch file://change-batch.json
