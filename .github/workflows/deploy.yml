name: Build and Deploy

on:
  release:
    types: [created]

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPO_BACKEND: 147997148756.dkr.ecr.us-east-1.amazonaws.com/aws-k8s-tf/backend
      ECR_REPO_FRONTEND: 147997148756.dkr.ecr.us-east-1.amazonaws.com/aws-k8s-tf/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get release tag
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Build and push backend
        run: |
          docker build -t $ECR_REPO_BACKEND:$RELEASE_VERSION ./backend/SumApi
          docker push $ECR_REPO_BACKEND:$RELEASE_VERSION

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REPO_FRONTEND:$RELEASE_VERSION ./frontend/sum-app
          docker push $ECR_REPO_FRONTEND:$RELEASE_VERSION
          
      - name: Setup kubectl
        run: |
          aws eks --region $AWS_REGION update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Update backend deployment image
        run: |
          kubectl set image deployment/backend -n backend backend=$ECR_REPO_BACKEND:$RELEASE_VERSION

      - name: Update frontend deployment image
        run: |
          kubectl set image deployment/frontend -n frontend frontend=$ECR_REPO_FRONTEND:$RELEASE_VERSION

